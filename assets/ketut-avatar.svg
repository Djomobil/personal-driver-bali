<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 360" role="img" aria-label="Ketut, private driver in Bali">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b6a53"/>
      <stop offset="1" stop-color="#0e3b2e"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8c98a"/>
      <stop offset="1" stop-color="#c9973f"/>
    </linearGradient>
  </defs>
  <rect width="360" height="360" fill="url(#bg)"/>
  <!-- sun -->
  <circle cx="270" cy="80" r="42" fill="url(#sun)" opacity="0.9"/>
  <!-- rice terrace hills -->
  <path d="M0 250 Q 90 200 180 235 T 360 225 V360 H0 Z" fill="#14503f"/>
  <path d="M0 285 Q 100 245 200 272 T 360 265 V360 H0 Z" fill="#0f4234"/>
  <path d="M0 320 Q 120 290 240 310 T 360 305 V360 H0 Z" fill="#0b342a"/>
  <!-- driver silhouette -->
  <g transform="translate(180 190)">
    <circle cx="0" cy="-48" r="34" fill="#e8c98a"/>
    <path d="M-52 60 Q -52 -6 0 -6 Q 52 -6 52 60 Z" fill="#e8c98a"/>
    <!-- udeng (Balinese headdress) hint -->
    <path d="M-30 -66 Q 0 -88 30 -66 L 26 -56 Q 0 -74 -26 -56 Z" fill="#c9973f"/>
  </g>
  <!-- steering wheel badge -->
  <g transform="translate(286 286)">
    <circle r="40" fill="#faf7f0"/>
    <circle r="30" fill="none" stroke="#14503f" stroke-width="7"/>
    <circle r="6" fill="#14503f"/>
    <path d="M-30 0 H30 M0 6 V30" stroke="#14503f" stroke-width="7" stroke-linecap="round"/>
  </g>
</svg>
