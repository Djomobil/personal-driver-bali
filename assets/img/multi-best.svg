<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9fd4c0"/>
      <stop offset="0.6" stop-color="#5aa887"/>
      <stop offset="1" stop-color="#e8c98a"/>
    </linearGradient>
    <linearGradient id="lake" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7fc4b0"/>
      <stop offset="1" stop-color="#2e6e63"/>
    </linearGradient>
  </defs>
  <rect width="400" height="260" fill="url(#sky)"/>
  <circle cx="84" cy="60" r="24" fill="#f2d795"/>

  <!-- hills -->
  <path d="M0 130 Q110 84 220 122 Q320 152 400 118 L400 260 L0 260 Z" fill="#3a8a6c"/>

  <!-- lake -->
  <rect y="170" width="400" height="90" fill="url(#lake)"/>
  <g stroke="#dff2e6" stroke-width="2" opacity="0.5" stroke-linecap="round">
    <path d="M60 196 H110"/><path d="M290 206 H340"/><path d="M150 226 H210"/>
  </g>

  <!-- meru temple (Ulun Danu style) on the lake -->
  <g fill="#123c2c">
    <rect x="186" y="140" width="28" height="34"/>
    <path d="M178 142 L222 142 L200 128 Z"/>
    <path d="M182 130 L218 130 L200 116 Z"/>
    <path d="M186 118 L214 118 L200 104 Z"/>
    <path d="M190 106 L210 106 L200 92 Z"/>
    <path d="M194 94 L206 94 L200 82 Z"/>
    <rect x="176" y="172" width="48" height="6" rx="2"/>
  </g>
  <ellipse cx="200" cy="184" rx="40" ry="6" fill="#123c2c" opacity="0.35"/>

  <!-- palm island left -->
  <g fill="#123c2c">
    <ellipse cx="60" cy="238" rx="52" ry="12"/>
    <path d="M52 238 L58 176 Q59 172 61 176 L66 238 Z"/>
    <g transform="translate(60 176) scale(0.62)">
      <path d="M0 0 Q-55 -32 -105 -14 Q-55 -50 0 -18 Z"/>
      <path d="M0 0 Q-35 -64 -85 -76 Q-30 -86 6 -22 Z"/>
      <path d="M0 0 Q8 -76 -24 -120 Q34 -88 10 -14 Z"/>
      <path d="M0 0 Q48 -60 100 -64 Q50 -26 5 -6 Z"/>
      <path d="M0 0 Q60 -20 104 8 Q54 18 2 5 Z"/>
    </g>
  </g>

  <!-- boat -->
  <g fill="#123c2c">
    <path d="M292 232 Q316 244 340 232 L334 244 Q316 250 298 244 Z"/>
    <rect x="314" y="206" width="3" height="28"/>
    <path d="M317 206 L336 226 L317 226 Z"/>
  </g>

  <!-- birds -->
  <g stroke="#2c5c40" stroke-width="2.4" fill="none" stroke-linecap="round" opacity="0.8">
    <path d="M280 64 Q287 57 294 64 Q301 57 308 64"/>
    <path d="M320 84 Q326 78 332 84 Q338 78 344 84"/>
  </g>
</svg>
