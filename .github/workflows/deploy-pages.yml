name: Deploy to GitHub Pages

# GitHub Pages is configured to serve the gh-pages branch.
# This workflow mirrors main into gh-pages on every push, which
# triggers the automatic "pages build and deployment" run.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  mirror-to-gh-pages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Push main to gh-pages
        run: git push origin HEAD:gh-pages --force
